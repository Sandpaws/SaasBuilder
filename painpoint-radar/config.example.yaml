# Copy to config.yaml and edit. Only list what you want to change; everything else uses the defaults in
# painpoint/config.py. Secrets (ANTHROPIC_API_KEY, REDDIT_*) go in environment variables, never in this file.

db_path: painpoint.db

# claude_code = run the Claude steps through your logged-in Claude Code (`claude -p`): no per-token billing,
#               it counts toward your subscription's usage limits. Run `claude` once to sign in.
# api         = call the Anthropic API directly (needs ANTHROPIC_API_KEY, billed per token).
backend: claude_code

cc:                       # settings for backend: claude_code
  models: {extract: haiku, merge: sonnet, solutions: sonnet}   # aliases always mean the latest of each
  batch_size: 6           # posts per call; 12 missed a clear pain post in testing, 6 and 3 did not
  workers: 2              # parallel `claude -p` processes; raise carefully, subscriptions have rolling limits

models:                   # settings for backend: api
  extract: claude-haiku-5-5
  solutions: claude-opus-5-5
  merge: claude-opus-5-5

llm:
  workers: 4
  use_fallbacks: auto   # api backend: on for models that support it (not Haiku 5.5); false on Bedrock/Vertex/Foundry

reddit:
  # Uses the official API through PRAW. Needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET / REDDIT_USER_AGENT.
  # Check Reddit's Data API terms and your access before using the data commercially.
  subreddits:             # check each with `painpoint subreddits check NAME` once you have API access
    - SaaS                # builders and founders
    - SideProject
    - SomebodyMakeThis    # people asking for tools to exist
    - AppIdeas
    - software
    - smallbusiness       # operators and buyers across industries
    - Entrepreneur
    - freelance
    - sysadmin            # IT staff and people leaving paid tools
    - selfhosted
  listing: top
  time_filter: month
  limit: 100
  include_comments: true
  search_queries:         # one search per phrase in each subreddit; finds on-topic complaints
    - '"is there a tool"'
    - '"wish there was"'
    - '"alternative to"'
    - '"frustrated with"'
  search_sort: top
  search_time: year
  search_limit: 25

hackernews:               # public Algolia API, no key; run: painpoint collect hn
  tags: [comment, ask_hn]
  since_days: 365
  max_per_query: 100
  # queries: ['"wish there was"', '"alternative to"']   # defaults are in painpoint/config.py

scoring:
  half_life_days: 180
  weights: {repetition: 0.40, intensity: 0.20, wtp: 0.15, competition_gap: 0.25}

